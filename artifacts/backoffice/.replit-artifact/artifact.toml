kind = "web"
previewPath = "/"
title = "ICL Backoffice"
description = "Painel administrativo do app ICL - Rede Regular. Permite ao administrador acompanhar indicadores de uso, denúncias, usuários e pontos, postos com selo ICL e sincronização ANP, recompensas e resgates, lendo os dados reais coletados pelo app."
version = "1.0.0"
id = "artifacts/backoffice"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22138

[services.development]
run = "pnpm --filter @workspace/backoffice run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/backoffice", "run", "build" ]
serve = "static"
publicDir = "artifacts/backoffice/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22138"
BASE_PATH = "/"
